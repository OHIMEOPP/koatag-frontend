# 桌面版發版：push desktop-v* 的 tag 時打包、簽名，上傳到 Oracle bucket 給 APP 自動更新
# 例：tauri.conf.json 版本改成 0.0.2 後，git tag desktop-v0.0.2 && git push origin desktop-v0.0.2
name: desktop-release

on:
  push:
    tags:
      - 'desktop-v*'

# 同一時間只跑一個發版，避免兩版互相蓋掉 latest.json
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      # checkout 拿到的 tag 可能沒有說明文字，重抓一次，更新內容寫在 tag 說明裡
      - name: 抓 tag 說明
        run: git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"

      # tag 的版本要跟 tauri.conf.json 一樣，不然 APP 比對版本會亂掉
      - name: 檢查版本
        id: version
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tag = "${{ github.ref_name }}" -replace '^desktop-v', ''
          if ($conf.version -ne $tag) {
            Write-Error "tag 是 $tag，tauri.conf.json 是 $($conf.version)，兩邊要一樣"
            exit 1
          }
          "version=$tag" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Rust 編譯很久，快取下來第二次之後快很多
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # 跟 Dockerfile 一樣用 --force，套件有 peer 版本衝突
      - name: 安裝前端套件
        run: npm ci --force

      # 打包時會先跑 npm run build，REACT_APP_* 在這一步寫死進安裝檔
      - name: 打包
        env:
          # CRA 在 CI=true 時會把 eslint 警告當錯誤
          CI: false
          REACT_APP_API_URL: ${{ vars.DESKTOP_API_URL }}
          REACT_APP_IMAGE_URL: ${{ vars.DESKTOP_IMAGE_URL }}
          REACT_APP_AI_API_URL: ${{ vars.DESKTOP_AI_API_URL }}
          REACT_APP_DESKTOP_SCHEME: koatag
          GENERATE_SOURCEMAP: false
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2 build

      # APP 讀 latest.json 比對版本，裡面寫安裝檔網址與簽名
      - name: 產生 latest.json
        id: files
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $dir = "src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem "$dir/*_${version}_x64-setup.exe" | Select-Object -First 1
          if (-not $exe) {
            Write-Error "找不到安裝檔"
            exit 1
          }
          $sig = Get-Content "$($exe.FullName).sig" -Raw
          $notes = git tag -l --format='%(contents)' "${{ github.ref_name }}"
          $latest = [ordered]@{
            version  = $version
            notes    = ($notes -join "`n").Trim()
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              'windows-x86_64' = @{
                signature = $sig.Trim()
                url       = "${{ vars.DESKTOP_UPDATE_BASE_URL }}$($exe.Name)"
              }
            }
          }
          $latest | ConvertTo-Json -Depth 5 | Set-Content "$dir/latest.json" -Encoding utf8NoBOM
          "exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "dir=$dir" >> $env:GITHUB_OUTPUT

      # Oracle 的 S3 相容介面要 path-style，新版 aws cli 的檢查碼功能要關掉
      - name: 上傳到 Oracle bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ap-tokyo-1
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          aws configure set default.s3.addressing_style path
          $endpoint = "${{ vars.OCI_S3_ENDPOINT }}"
          $bucket = "${{ vars.DESKTOP_BUCKET }}"
          $exe = "${{ steps.files.outputs.exe }}"
          $dir = "${{ steps.files.outputs.dir }}"
          # 安裝檔與簽名先傳，latest.json 最後傳，APP 才不會看到新版卻下載不到
          aws s3 cp $exe "s3://$bucket/" --endpoint-url $endpoint
          aws s3 cp "$exe.sig" "s3://$bucket/" --endpoint-url $endpoint
          aws s3 cp "$dir/latest.json" "s3://$bucket/latest.json" --endpoint-url $endpoint --content-type application/json

      # 第一次安裝要手動下載，安裝檔也放一份在這次執行的 Artifacts
      # 上傳 bucket 失敗也照放，有產出安裝檔就留
      - uses: actions/upload-artifact@v4
        if: always() && steps.files.outcome == 'success'
        with:
          name: koatag-setup-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.files.outputs.exe }}
            ${{ steps.files.outputs.dir }}/latest.json
