server {
    listen       80;
    server_name  _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 壓縮
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml application/x-font-ttf font/ttf font/otf font/woff font/woff2;

    # CRA static 檔名自帶內容 hash，可安全設 immutable 長快取
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
